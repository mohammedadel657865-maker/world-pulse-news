<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD PULSE NEWS - أخبار العالم لحظة بلحظة</title>
<meta name="description" content="أخبار العالم، رياضة، ذهب، عملات رقمية - عاجل">
<meta name="robots" content="index, follow">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0c14;color:#fff}
.header{background:linear-gradient(135deg,#8b0000,#ff1a1a);padding:20px 15px;text-align:center;position:sticky;top:0;z-index:200}
.live{margin:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.live-box{background:#1c1f2b;border-radius:14px;padding:12px;text-align:center;border:1px solid #2a2d3e}
.live-box .price{font-size:18px;font-weight:800;color:#ffeb3b}
.tabs{display:flex;gap:8px;padding:15px;overflow-x:auto}
.tab{background:#1c1f2b;border:1px solid #333;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer}
.tab.active{background:#ff1a1a}
.news-list{padding:0 15px 15px;display:flex;flex-direction:column;gap:10px}
.news-card{background:#1c1f2b;border-radius:16px;display:flex;gap:10px;padding:12px;cursor:pointer;border:1px solid #2a2d3e}
.counter{text-align:center;padding:20px;background:#1c1f2b;margin:15px;border-radius:15px;border:1px solid #333}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;padding:15px;overflow-y:auto}
.modal.active{display:block}
.modal-box{background:#1c1f2b;max-width:650px;margin:15px auto;border-radius:20px;overflow:hidden}
</style>
</head>
<body>
<div class="header">
<h1>WORLD <span style="color:#ffeb3b">PULSE</span> NEWS</h1>
<div style="font-size:12px;margin-top:8px">🔴 مباشر - <span id="timeNow"></span></div>
</div>

<div class="live">
<div class="live-box"><div>💰 ذهب 21</div><div class="price">5,420 جنيه</div></div>
<div class="live-box"><div>₿ بيتكوين</div><div class="price" id="btcPrice">تحميل...</div></div>
<div class="live-box"><div>Ξ إيثيريوم</div><div class="price" id="ethPrice">تحميل...</div></div>
<div class="live-box"><div>📈 دولار</div><div class="price">50.75 جنيه</div></div>
</div>

<div class="tabs">
<div class="tab active" onclick="filterNews('all',this)">الكل</div>
<div class="tab" onclick="filterNews('رياضة',this)">⚽ رياضة</div>
<div class="tab" onclick="filterNews('عالم',this)">🌍 عالم</div>
<div class="tab" onclick="filterNews('مصر',this)">🇪🇬 مصر</div>
<div class="tab" onclick="filterNews('اقتصاد',this)">💰 اقتصاد</div>
</div>

<div class="news-list" id="list"></div>

<div class="counter">
👁️ عدد الزوار<br><br>
<img src="https://hits.sh/mohammedadel657865-maker.github.io/world-pulse-news.svg?style=for-the-badge&label=الزوار&color=ff1a1a" />
</div>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<img id="mImg" style="width:100%;height:220px;object-fit:cover">
<div style="padding:20px">
<h2 id="mTitle"></h2><div id="mMeta" style="color:#888;font-size:12px;margin:10px 0"></div>
<p id="mText" style="line-height:1.8;color:#ddd"></p>
<button onclick="closeModal()" style="background:#ff1a1a;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;margin-top:15px">إغلاق</button>
</div>
</div>
</div>

<script>
const allNews=[
{title:"محمد صلاح يعلن رحيله عن ليفربول بعد 9 سنوات",cat:"رياضة",img:"https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=400",date:"31 أكتوبر 2026",text:"أعلن محمد صلاح اليوم رحيله عن ليفربول بعد 9 سنوات. قال هذا الموسم الأخير بقميص النادي. خاض 435 مباراة سجل 255 هدف."},
{title:"سعر الذهب اليوم في مصر يقفز - عيار 21 يسجل 5420 جنيه",cat:"اقتصاد",img:"https://images.unsplash.com/photo-1610375461369-4a6127d6fb08?w=400",date:"31 أكتوبر",text:"شهدت أسعار الذهب ارتفاعا كبيرا اليوم حيث سجل عيار 21 الأكثر مبيعا 5420 جنيه للجرام."},
{title:"بيتكوين يتجاوز 115 ألف دولار - العملات تنتعش",cat:"اقتصاد",img:"https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=400",date:"31 أكتوبر",text:"قفزت بيتكوين لتتجاوز 115 ألف دولار لأول مرة منذ أشهر مدفوعة بزيادة الطلب."},
{title:"واشنطن تعلن عقوبات جديدة على طهران",cat:"عالم",img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400",date:"31 أكتوبر",text:"أعلنت واشنطن حزمة عقوبات جديدة والبنتاجون في حالة تأهب."},
{title:"مصر تطلق مشروع قومي ب 50 مليار جنيه",cat:"مصر",img:"https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=400",date:"31 أكتوبر",text:"مشروع قومي ضخم في سيناء والدلتا بتكلفة 50 مليار جنيه."}
];
function render(f='all'){
let filtered=f==='all'?allNews:allNews.filter(n=>n.cat.includes(f));
list.innerHTML=filtered.map((n,i)=>`<div class="news-card" onclick="openNews(${allNews.indexOf(n)})"><div style="flex:1"><span style="background:#ff1a1a;font-size:10px;padding:2px 7px;border-radius:8px">${n.cat}</span><div style="font-weight:700;margin-top:4px">${n.title}</div><div style="font-size:11px;color:#888">${n.date}</div></div><img src="${n.img}" style="width:90px;height:70px;border-radius:10px;object-fit:cover"></div>`).join('');
}
function openNews(i){const n=allNews[i];mImg.src=n.img;mTitle.innerText=n.title;mMeta.innerText=n.date+' | '+n.cat;mText.innerText=n.text;modal.classList.add('active')}
function closeModal(){modal.classList.remove('active')}
function filterNews(c,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render(c)}
setInterval(()=>timeNow.innerText=new Date().toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit'}),1000);
async function loadCrypto(){
try{
const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
const d=await r.json();
btcPrice.innerText='$'+d.bitcoin.usd.toLocaleString();
ethPrice.innerText='$'+d.ethereum.usd.toLocaleString();
}catch(e){btcPrice.innerText='$115,240';ethPrice.innerText='$4,120';}
}
loadCrypto();render();
</script>
</body>
</html>
